[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "db", "kpi_client", "migrate", "seed", "service", "web"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["service", "migrate"]
