[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "db", "migrate", "routing_client", "seed", "service", "web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the service modules (app, db, service...) sit next to tests/, not in a package
pythonpath = ["."]

[tool.coverage.run]
source = ["service", "migrate"]
