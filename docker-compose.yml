# Local stack: `docker compose up --build`, then open http://localhost:8080 (the proxy). Passwords below are LOCAL-ONLY defaults for a
# throwaway container on your machine; Azure uses different passwords stored as GitHub secrets.
# Override any of them with a .env file (git-ignored).
x-mssql-image: &mssql_image mcr.microsoft.com/mssql/server:2022-latest

services:
  sqlserver:
    image: *mssql_image
    platform: linux/amd64   # on Apple Silicon: enable Rosetta in Docker Desktop
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Local_Sa_Passw0rd}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  db-init:
    image: *mssql_image
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./db:/db:ro
    entrypoint:
      - /opt/mssql-tools18/bin/sqlcmd
      - -C
      - -b
      - -S
      - sqlserver
      - -U
      - sa
      - -P
      - ${MSSQL_SA_PASSWORD:-Local_Sa_Passw0rd}
      - -i
      - /db/init.sql
      - -v
      - KPI_DB_PASSWORD=${KPI_DB_PASSWORD:-Local_Kpi_Passw0rd}
      - ROUTING_DB_PASSWORD=${ROUTING_DB_PASSWORD:-Local_Routing_Passw0rd}
    restart: "no"

  kpi:
    build: ./services/kpi
    restart: unless-stopped   # e.g. the database was not reachable yet at boot
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      PORT: "8000"
      DATABASE_URL: mssql://kpi_svc:${KPI_DB_PASSWORD:-Local_Kpi_Passw0rd}@sqlserver:1433/kpi
      ROUTING_URL: http://routing:8000
      ROUTING_TIMEOUT_S: "2"
      CORS_ORIGINS: http://localhost:8080
      SEED_DEMO: "1"
      GIT_SHA: local
    ports:
      - "8001:8000"   # direct access for debugging; the UI goes through the proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  routing:
    build: ./services/routing
    restart: unless-stopped   # e.g. the database was not reachable yet at boot
    depends_on:
      db-init:
        condition: service_completed_successfully
      kpi:
        condition: service_started   # only so the demo seed can find brokers; routing runs without kpi
    environment:
      PORT: "8000"
      DATABASE_URL: mssql://routing_svc:${ROUTING_DB_PASSWORD:-Local_Routing_Passw0rd}@sqlserver:1433/routing
      KPI_URL: http://kpi:8000
      KPI_TIMEOUT_S: "2"
      CORS_ORIGINS: http://localhost:8080
      SEED_DEMO: "1"
      GIT_SHA: local
    ports:
      - "8002:8000"   # direct access for debugging; the UI goes through the proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  ui:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./ui:/usr/share/nginx/html:ro
    # no published port: the browser reaches it through the proxy

  # same proxy and config as on the Azure VM: open http://localhost:8080
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - ui
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

volumes:
  sqldata:
