# CD: deploys to Azure after CI passed on a push to main, and only then (assignment §5, §7).
#   images   build both service images and push them to GHCR, tagged with the commit SHA
#   deploy   terraform: the databases first, then the contained database users, then
#            everything else, which updates both Container Apps to the new image tag
#   ui       generate ui/config.js with the two Container Apps' URLs and deploy ui/ to the
#            Static Web App with its deployment token (a GitHub secret)
#   verify   poll both services' /health for up to 3 minutes; fail unless 200 with this SHA
#
# Secrets and variables it needs are listed in README.md ("GitHub secrets and variables").
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write # push images to GHCR

# never two deploys at once, and never cancel one halfway through a terraform apply
concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  # the exact commit CI tested, not whatever main points at by now
  SHA: ${{ github.event.workflow_run.head_sha }}
  TF_DIR: infra/terraform
  TF_VERSION: 1.17.2
  PREFIX: jelaawar-ieu2023

jobs:
  images:
    name: push ${{ matrix.service }} image
    # CI passed, and it ran for a push (a merged PR), not for a pull request
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        service: [kpi, routing]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (GHCR needs a lowercase owner)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.service }}
          push: true
          # the SHA tag is what gets deployed; latest is only a convenience for humans
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.SHA }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: terraform + UI
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    env:
      # the class service principal, read by the azurerm provider and backend
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Terraform input variables (TF_VAR_<name>)
      TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
      TF_VAR_image_tag: ${{ github.event.workflow_run.head_sha }}
      TF_VAR_sql_admin_password: ${{ secrets.SQL_ADMIN_PASSWORD }}
      TF_VAR_kpi_db_password: ${{ secrets.KPI_DB_PASSWORD }}
      TF_VAR_routing_db_password: ${{ secrets.ROUTING_DB_PASSWORD }}
      # empty unless the GHCR packages are private (see infra/bootstrap.md)
      TF_VAR_registry_username: ${{ secrets.GHCR_PULL_USER }}
      TF_VAR_registry_password: ${{ secrets.GHCR_PULL_TOKEN }}
      TF_VAR_seed_demo: ${{ vars.SEED_DEMO || '1' }}
      TF_IN_AUTOMATION: "true"
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    outputs:
      kpi_url: ${{ steps.out.outputs.kpi_url }}
      routing_url: ${{ steps.out.outputs.routing_url }}
      ui_url: ${{ steps.out.outputs.ui_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install pymssql==2.4.6

      # The backend block in providers.tf is empty. The state storage account is provided by
      # the professor; where it is comes from secrets.
      - name: terraform init (remote state)
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}"
          -backend-config="key=jelaawar-ieu2023.tfstate"

      # The apps connect as their own contained database users, which can only be created
      # once the databases exist. So the databases go first, then the users, then the rest.
      # On every later deploy this step finds nothing to change.
      - name: terraform apply, databases only
        run: |
          terraform plan -input=false -lock-timeout=5m -out=databases.tfplan \
            -target=azurerm_mssql_database.service -target=azurerm_mssql_firewall_rule.azure_services
          terraform apply -input=false -lock-timeout=5m databases.tfplan

      # The SQL firewall only lets in Azure services. Open it for this runner's IP while the
      # users are created, and always close it again afterwards.
      - name: Open the SQL firewall for this runner
        run: |
          ip=$(curl -fsS https://api.ipify.org)
          az sql server firewall-rule create --resource-group "$RESOURCE_GROUP" --server "$PREFIX-sql" \
            --name "gha-cd-${{ github.run_id }}" --start-ip-address "$ip" --end-ip-address "$ip" --output none

      - name: Create or update the contained database users
        working-directory: .
        env:
          SQL_SERVER_FQDN: ${{ env.PREFIX }}-sql.database.windows.net
          SQL_ADMIN_LOGIN: jelaawar_sqladmin # sql_admin_login in variables.tf
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          KPI_DATABASE: ${{ env.PREFIX }}-kpi-db
          KPI_DB_PASSWORD: ${{ secrets.KPI_DB_PASSWORD }}
          ROUTING_DATABASE: ${{ env.PREFIX }}-routing-db
          ROUTING_DB_PASSWORD: ${{ secrets.ROUTING_DB_PASSWORD }}
        run: python infra/scripts/create_db_users.py

      - name: Close the SQL firewall again
        if: always()
        run: |
          az sql server firewall-rule delete --resource-group "$RESOURCE_GROUP" --server "$PREFIX-sql" \
            --name "gha-cd-${{ github.run_id }}" --output none || true

      # everything else: Container Apps environment, both apps on the new image tag, Static Web App
      - name: terraform plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      # applies exactly the plan above, nothing that changed in between
      - name: terraform apply
        run: terraform apply -input=false -lock-timeout=5m tfplan

      - name: Read outputs
        id: out
        run: |
          terraform output -json > outputs.json
          {
            echo "kpi_url=$(jq -r .kpi_url.value outputs.json)"
            echo "routing_url=$(jq -r .routing_url.value outputs.json)"
            echo "ui_url=$(jq -r .ui_url.value outputs.json)"
          } >> "$GITHUB_OUTPUT"

  ui:
    name: deploy the UI to the Static Web App
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KPI_URL: ${{ needs.deploy.outputs.kpi_url }}
      ROUTING_URL: ${{ needs.deploy.outputs.routing_url }}
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      # The deployment token only exists once Terraform has created the Static Web App, so on
      # the very first deploy the secret is still empty: say exactly what to do.
      - name: Check the deployment token secret
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "::error::Secret AZURE_STATIC_WEB_APPS_API_TOKEN is empty. Get the token with: az staticwebapp secrets list -g <resource group> -n jelaawar-ieu2023-ui --query properties.apiKey -o tsv, set it with gh secret set AZURE_STATIC_WEB_APPS_API_TOKEN, then re-run this job."
            exit 1
          fi

      # The UI is the same files as locally, except config.js, which gets the two Container
      # Apps' URLs instead of localhost.
      - name: Generate config.js
        run: |
          mkdir -p build
          cp -R ui build/ui
          cat > build/ui/config.js <<EOF
          // Generated by the CD pipeline for commit ${SHA}.
          window.APP_CONFIG = {
            KPI_URL: "${KPI_URL}",
            ROUTING_URL: "${ROUTING_URL}",
          };
          EOF
          cat build/ui/config.js

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: build/ui
          skip_app_build: true
          skip_api_build: true

  verify:
    name: health check
    needs: [deploy, ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      KPI_URL: ${{ needs.deploy.outputs.kpi_url }}
      ROUTING_URL: ${{ needs.deploy.outputs.routing_url }}
      UI_URL: ${{ needs.deploy.outputs.ui_url }}
    steps:
      # 3 minutes: each app starts from zero replicas, its database may be paused (up to about
      # a minute to resume), and it runs any pending migrations before it answers (§7.5)
      - name: Poll both services' /health until 200 with this commit's version
        run: |
          deadline=$((SECONDS + 180))
          while [ "$SECONDS" -lt "$deadline" ]; do
            all_ok=true
            for url in "$KPI_URL" "$ROUTING_URL"; do
              rm -f health.json
              code=$(curl -s -o health.json -w '%{http_code}' --max-time 60 "$url/health" || true)
              version=$(jq -r .version health.json 2>/dev/null || true)
              echo "$(date -u +%T) $url/health -> $code version=$version"
              if [ "$code" != 200 ] || [ "$version" != "$SHA" ]; then all_ok=false; fi
            done
            if $all_ok; then echo "both services run $SHA and are healthy"; exit 0; fi
            sleep 10
          done
          echo "::error::the services did not return 200 for $SHA within 3 minutes"
          exit 1

      - name: The UI is served and points at both services
        run: |
          curl -fsS --max-time 30 "$UI_URL/" | grep -q "<title>"
          curl -fsS --max-time 30 "$UI_URL/config.js" | tee config.js
          grep -q "$KPI_URL" config.js && grep -q "$ROUTING_URL" config.js
          echo "live at $UI_URL"
