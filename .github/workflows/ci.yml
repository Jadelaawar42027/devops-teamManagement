# CI: runs on every push and every pull request. Never touches Azure: the tests use a SQL
# Server container on the runner. CD (cd.yml) starts only when this whole workflow passed
# on a push to main.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# a newer push to the same branch or PR makes the older, still-running CI pointless
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    name: ${{ matrix.service }} (lint, test, coverage, image)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false # see both services' results even if one fails
      matrix:
        service: [kpi, routing]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    env:
      # Throwaway password for a SQL Server that lives only for this job, on the runner's
      # localhost. Built from the run id so no fixed password sits in the repository.
      MSSQL_SA_PASSWORD: Ci_${{ github.run_id }}_Pw
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci_${{ github.run_id }}_Pw
        ports:
          - 1433:1433
        # the job's steps start only once this reports healthy
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      # The conftest creates a fresh database from DATABASE_URL (as sa), runs the real
      # migrations into it and drops it at the end. --cov uses [tool.coverage.run] in
      # pyproject.toml: service.py and migrate.py, the core logic.
      - name: Test with coverage (fails under 70%)
        env:
          DATABASE_URL: mssql://sa:${{ env.MSSQL_SA_PASSWORD }}@localhost:1433/master
        run: pytest --cov --cov-report=term-missing --cov-fail-under=70

      - name: Coverage summary
        if: always()
        run: |
          echo "### Coverage: ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Build the image
        run: docker build --tag "${{ matrix.service }}:${{ github.sha }}" .

  integration:
    name: cross-seam integration (compose stack)
    needs: service
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      KPI_URL: http://localhost:8001
      ROUTING_URL: http://localhost:8002
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test tools
        run: pip install -r tests/integration/requirements.txt

      # the real stack: SQL Server, db-init, kpi, routing and the ui (stock nginx)
      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait until both services are healthy
        run: timeout 300 bash -c "until curl -fsS $KPI_URL/health && curl -fsS $ROUTING_URL/health; do sleep 5; done"

      - name: Both services up
        run: pytest tests/integration -v

      - name: Routing stopped (dashboard degrades)
        env:
          SEAM_ROUTING_STOPPED: "1"
        run: |
          docker compose stop routing
          pytest tests/integration -v
          docker compose start routing
          timeout 120 bash -c "until curl -fsS $ROUTING_URL/health; do sleep 3; done"

      - name: KPI stopped (lead saved unassigned)
        env:
          SEAM_KPI_STOPPED: "1"
        run: |
          docker compose stop kpi
          pytest tests/integration -v
          docker compose start kpi
          timeout 120 bash -c "until curl -fsS $KPI_URL/health; do sleep 3; done"

      # assignment §4.2: migrations are recorded, so a second boot applies nothing
      - name: A restart applies no migrations
        run: |
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker compose restart kpi routing
          timeout 120 bash -c "until curl -fsS $KPI_URL/health && curl -fsS $ROUTING_URL/health; do sleep 3; done"
          docker compose logs --no-color --since "$since" kpi routing > restart.log
          grep migrate restart.log
          if [ "$(grep -c 'migrations up to date' restart.log)" -ne 2 ]; then
            echo "expected both services to log 'migrations up to date'"; exit 1
          fi
          if grep -q 'applied migration' restart.log; then
            echo "a restart applied a migration again"; exit 1
          fi

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  terraform:
    name: terraform (fmt, validate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      # -backend=false: no Azure credentials in CI; this only checks the configuration
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  specs:
    name: specs (OpenAPI, system.yaml, workflows)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validators
        run: pip install openapi-spec-validator==0.9.0 check-jsonschema==0.39.0

      - name: OpenAPI documents are valid OpenAPI
        run: openapi-spec-validator services/kpi/openapi.yaml services/routing/openapi.yaml

      # The provided schema requires ui.storage_account, but the assignment PDF puts the UI on
      # a Static Web App (ADR-8). CI validates against a copy with exactly one allowance:
      # ui.static_web_app instead of ui.storage_account. system.schema.json itself is untouched.
      - name: Show the one change the CI copy of the schema makes
        run: python scripts/patch_schema_for_swa.py --diff

      - name: system.yaml matches system.schema.json (plus the Static Web App allowance)
        run: |
          python scripts/patch_schema_for_swa.py --output "$RUNNER_TEMP/system.schema.ci.json" > /dev/null
          check-jsonschema --schemafile "$RUNNER_TEMP/system.schema.ci.json" system.yaml

      - name: Lint workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
