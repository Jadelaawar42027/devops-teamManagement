# Reverse proxy in front of ui, kpi and routing: the only container with a published port.
# The same file is used locally (docker-compose.yml) and on the Azure VM
# (deploy/docker-compose.prod.yml), so local behaves like prod.
#
#   /              -> ui:80        static front end
#   /api/kpi/...   -> kpi:8000/... (prefix stripped)
#   /api/routing/..-> routing:8000/...
#   /health        -> 200 only if BOTH services answer 200 on their own /health
#   /lb-probe      -> 200 from nginx itself (Azure load balancer probe; touches no database)

# Docker's built-in DNS. Upstream names are kept in variables, so nginx looks them up per
# request (cached 10s) instead of once at startup. That way the proxy still starts while a
# service is stopped, and finds a restarted container at its new IP.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 64k;

    set $kpi_upstream http://kpi:8000;
    set $routing_upstream http://routing:8000;
    set $ui_upstream http://ui:80;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    # Azure SQL serverless can take about a minute to resume from auto-pause
    proxy_read_timeout 90s;

    location /api/kpi/ {
        rewrite ^/api/kpi/(.*)$ /$1 break;
        proxy_pass $kpi_upstream;
        # only errors nginx makes itself (service stopped, timed out): the app's own
        # 4xx/5xx JSON answers pass through untouched
        error_page 502 503 504 = @kpi_down;
    }

    location /api/routing/ {
        rewrite ^/api/routing/(.*)$ /$1 break;
        proxy_pass $routing_upstream;
        error_page 502 503 504 = @routing_down;
    }

    location = /health {
        # step 1: kpi must answer 2xx, otherwise auth_request fails with 500
        auth_request /_health/kpi;
        # step 2: routing's answer becomes the response; a 503 from it is turned into ours
        proxy_pass $routing_upstream/health;
        proxy_intercept_errors on;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        error_page 500 502 503 504 = @unhealthy;
    }

    # For the Azure load balancer's probe (every 15s). Answered by nginx alone: if it went to
    # /health, every probe would reach both serverless databases and they would never
    # auto-pause. With a single VM there is nowhere else to send traffic anyway, so the
    # probe only needs to know that nginx is up; /health is for the pipeline and for people.
    location = /lb-probe {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /_health/kpi {
        internal;
        proxy_pass $kpi_upstream/health;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location / {
        proxy_pass $ui_upstream;
        # revalidate on every load (cheap 304s via ETag), so a deploy never leaves a browser
        # running an old mix of HTML and JS modules
        add_header Cache-Control "no-cache" always;
        error_page 502 503 504 = @ui_down;
    }

    location @kpi_down {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"KPI service unavailable"}';
    }

    location @routing_down {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"Routing service unavailable"}';
    }

    location @unhealthy {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"status":"error","detail":"kpi or routing is not healthy"}';
    }

    location @ui_down {
        default_type text/plain;
        return 503 "The front end is not available right now.";
    }
}
