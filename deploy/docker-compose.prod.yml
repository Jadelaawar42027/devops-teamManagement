# Production stack on the Azure VM. The pipeline (.github/workflows/cd.yml) copies the repo's
# layout to the VM, so paths here match the repository:
#   /opt/app/deploy/docker-compose.prod.yml   this file
#   /opt/app/deploy/nginx.conf                the same proxy config as local
#   /opt/app/deploy/.env                      written by the pipeline from GitHub secrets (mode 600)
#   /opt/app/ui/                              the static front end
# and then runs, in /opt/app/deploy:  docker compose -f docker-compose.prod.yml pull && ... up -d
#
# Differences from the local docker-compose.yml:
#   - no SQL Server container: each service uses its own Azure SQL serverless database
#   - images come from GHCR, tagged with the commit SHA, instead of being built here
#   - kpi and routing have no Docker healthcheck. Their /health writes to the database, and
#     a check every few seconds would keep the serverless databases from ever pausing.
#     The pipeline calls /health once after each deploy instead.
#   - only port 80 is published; the load balancer forwards to it
name: teammanagement

x-logging: &logging
  # keep container logs from filling the 30 GB disk: 3 files of 10 MB per container
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  kpi:
    image: ghcr.io/${GHCR_OWNER:?set in .env}/kpi:${IMAGE_TAG:?set in .env}
    restart: unless-stopped
    environment:
      PORT: "8000"
      DATABASE_URL: ${KPI_DATABASE_URL:?set in .env}
      ROUTING_URL: http://routing:8000
      ROUTING_TIMEOUT_S: "2"
      SEED_DEMO: ${SEED_DEMO:-0}
      GIT_SHA: ${IMAGE_TAG}
    logging: *logging

  routing:
    image: ghcr.io/${GHCR_OWNER:?set in .env}/routing:${IMAGE_TAG:?set in .env}
    restart: unless-stopped
    depends_on:
      - kpi # only so the demo seed finds KPI's brokers sooner; routing runs without kpi
    environment:
      PORT: "8000"
      DATABASE_URL: ${ROUTING_DATABASE_URL:?set in .env}
      KPI_URL: http://kpi:8000
      KPI_TIMEOUT_S: "2"
      SEED_DEMO: ${SEED_DEMO:-0}
      GIT_SHA: ${IMAGE_TAG}
    logging: *logging

  ui:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../ui:/usr/share/nginx/html:ro
    logging: *logging

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - ui
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    logging: *logging
